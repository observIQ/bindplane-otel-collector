name: release
on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - arch: amd64
            msi_name: dbdot-collector-amd64.msi
            msi_arch: x64
          - arch: arm64
            msi_name: dbdot-collector-arm64.msi
            msi_arch: arm64
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: internal/extension/opampconnectionextension/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Grant access to private Dynatrace Go modules
        uses: ./.github/actions/private-go-modules
        with:
          app-id: ${{ vars.PRIVATE_GO_MODULES_APP_ID }}
          private-key: ${{ secrets.PRIVATE_GO_MODULES_APP_PRIVATE_KEY }}
      - name: Install ocb
        run: make install-ocb
        shell: bash
      - name: Prepare Release Dependencies
        run: make release-prep CURR_VERSION=${VERSION#v}
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
      - name: Build Windows Binaries
        run: make build-windows-${{ matrix.arch }}
      - name: Copy Shared Files to MSI Build Directory
        run: |
          cp -r release_deps/plugins windows/
          cp config/example.yaml windows/config.yaml
          cp config/logging.yaml windows/logging.yaml
          cp LICENSE windows/LICENSE
          cp release_deps/VERSION.txt windows/VERSION.txt
      - name: Copy Binaries
        run: |
          cp dist/collector_windows_${{ matrix.arch }}.exe windows/dbdot-collector.exe
          cp dist/updater_windows_${{ matrix.arch }}.exe windows/updater.exe
      # HACK: Copy build directory to C drive to avoid this error, since there must be a relative path from the tempdir that go-msi uses
      # for the MSI to build properly
      - name: Copy Build Dir
        run: |
          cp -r windows C:/build
          echo "C:/build" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # Installs go-msi and wix.
      - name: Install Build Tools
        run: |
          curl -f -L -o go-msi.exe https://github.com/observIQ/go-msi/releases/download/v2.2.0/go-msi.exe
          curl -f -L -o wix314-binaries.zip https://github.com/wixtoolset/wix3/releases/download/wix314rtm/wix314-binaries.zip
          unzip wix314-binaries.zip
        working-directory: C:/build
      - name: Build MSI
        run: go-msi.exe make -m ${{ matrix.msi_name }} --version ${{ github.ref_name }} --arch ${{ matrix.msi_arch }}
        working-directory: C:/build
      - name: Install DigiCert Client tools from Github Custom Actions marketplace
        uses: digicert/ssm-code-signing@v1.0.0
      - name: Set up certificate
        run: |
          echo "${{ secrets.SM_CLIENT_CERT_FILE_B64 }}" | base64 --decode > /d/Certificate_pkcs12.p12
        shell: bash
      - name: Set variables for signing
        id: variables
        run: |
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "SM_HOST=${{ secrets.SM_HOST }}" >> "$GITHUB_ENV"
          echo "SM_API_KEY=${{ secrets.SM_API_KEY }}" >> "$GITHUB_ENV"
          echo "SM_CLIENT_CERT_FILE=D:\\Certificate_pkcs12.p12" >> "$GITHUB_ENV"
          echo "SM_CLIENT_CERT_PASSWORD=${{ secrets.SM_CLIENT_CERT_PASSWORD }}" >> "$GITHUB_ENV"
        shell: bash
      - name: Sign MSI
        run: |
          smctl sign --keypair-alias ${{ secrets.DBDOT_DIGICERT_KEYPAIR_ALIAS }} --input C:/build/${{ matrix.msi_name }} --config-file C:\Users\RUNNER~1\AppData\Local\Temp\smtools-windows-x64\pkcs11properties.cfg
        shell: cmd
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.msi_name }}
          path: C:/build/${{ matrix.msi_name }}
          # Short lived because Go Releaser will upload the msi to a release (github release, gcs, etc)
          retention-days: 1

  release:
    needs: [build-msi]
    runs-on:
      group: bindplane-large
      labels: ubuntu-latest-32-cores
    steps:
      - name: Redirect temp directories
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "GOTMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # For goreleaser
          fetch-depth: 0
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.DBDOT_GCS_RELEASE_BUCKET_PROJECT_ID }}
          credentials_json: ${{ secrets.DBDOT_GCS_RELEASE_BUCKET_CREDENTIALS }}
      - name: Install Gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: internal/extension/opampconnectionextension/go.mod
          cache: false # Caching handled by the actions/cache step below
      - name: Set up Go cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Grant access to private Dynatrace Go modules
        uses: ./.github/actions/private-go-modules
        with:
          app-id: ${{ vars.PRIVATE_GO_MODULES_APP_ID }}
          private-key: ${{ secrets.PRIVATE_GO_MODULES_APP_PRIVATE_KEY }}
      - name: Install ocb
        run: make install-ocb
      - name: Retrieve Windows AMD64 MSI Installer
        uses: actions/download-artifact@v4
        with:
          name: dbdot-collector-amd64.msi
      - name: Retrieve Windows ARM64 MSI Installer
        uses: actions/download-artifact@v4
        with:
          name: dbdot-collector-arm64.msi
      - name: Install cosign
        run: go install github.com/sigstore/cosign/cmd/cosign@v1.13.1
      - name: Build cosign key file
        run: 'echo "$COSIGN_PRIVATE_KEY" >> cosign.key'
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{secrets.COSIGN_PRIVATE_KEY}}
      - name: Cache Goreleaser Build
        uses: actions/cache@v6
        with:
          path: ~/.cache/goreleaser
          key: ${{ runner.os }}-goreleaser-${{ hashFiles('.goreleaser.yml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-goreleaser-
      - name: Sign AMD64 MSI
        run: cosign sign-blob --key=cosign.key --output-signature ./dbdot-collector-amd64.msi.sig ./dbdot-collector-amd64.msi
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PWD }}
      - name: Sign ARM64 MSI
        run: cosign sign-blob --key=cosign.key --output-signature ./dbdot-collector-arm64.msi.sig ./dbdot-collector-arm64.msi
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PWD }}
      - name: Write signing key for nFPM
        shell: bash
        run: |
          cat > ci-signing-key.asc <<'EOF'
          ${{ secrets.GPG_PRIVATE_SIGNING_KEY }}
          EOF
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: "v2.12.5"
          args: release --clean --timeout 120m
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          COSIGN_PWD: ${{ secrets.COSIGN_PWD }}
          SIGNING_KEY_FILE: ci-signing-key.asc
      # Create artifact bundle and upload to release
      - name: Create artifact archive
        run: |
          mkdir artifacts
          cp ./scripts/install/*.sh ./artifacts
          cp ./scripts/install/*.ps1 ./artifacts
          cp ./release_deps/gpg-keys.tar.gz ./artifacts/gpg-keys.tar.gz
          cp ./dbdot-collector-amd64.msi ./artifacts
          cp ./dbdot-collector-arm64.msi ./artifacts
          cp ./dist/*tar.gz ./artifacts
          cp ./dist/*.zip ./artifacts
          cp ./dist/*.rpm ./artifacts
          cp ./dist/*.deb ./artifacts
          cp ./dist/*SHA256SUMS ./artifacts
          tar -czvf dbdot-collector-${{ github.ref_name }}-artifacts.tar.gz -C ./artifacts .
      - name: Sign artifact archive
        run: cosign sign-blob --key=cosign.key --output-signature ./dbdot-collector-${{ github.ref_name }}-artifacts.tar.gz.sig ./dbdot-collector-${{ github.ref_name }}-artifacts.tar.gz
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PWD }}
      - name: Upload Latest Install Scripts
        run: |
          gsutil cp ./scripts/install/install_unix.sh gs://dbdot-release/latest/install_unix.sh
          gsutil cp ./scripts/install/install_macos.sh gs://dbdot-release/latest/install_macos.sh
          gsutil cp ./scripts/install/install_windows.ps1 gs://dbdot-release/latest/install_windows.ps1
          gsutil cp ./release_deps/gpg-keys.tar.gz gs://dbdot-release/latest/gpg-keys.tar.gz
      - name: Upload artifact bundle to release
        uses: AButler/upload-release-assets@v2.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          files: "dbdot-collector-${{ github.ref_name }}-artifacts.tar.gz*"
          release-tag: ${{ github.ref_name }}
      # TODO(dbdot): the installer testing repo does not exist yet. GITHUB_TOKEN
      # cannot dispatch to another repository; this needs a PAT or GitHub App
      # token once the repo exists.
      # - name: Trigger Installation Testing
      #   uses: peter-evans/repository-dispatch@v2
      #   with:
      #     token: ${{ secrets.GITHUB_TOKEN }}
      #     repository: TODO-DBDOT-INSTALLER-TESTING-REPO
      #     event-type: upstream_prerelease
      #     client-payload: '{ "version": "${{ github.ref_name }}" }'
