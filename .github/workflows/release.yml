name: release
on:
  push:
    tags:
      - "v[0-9]*"

jobs:
  build-msi:
    uses: ./.github/workflows/build-signed-windows.yml
    with:
      version: ${{ github.ref_name }}
      sign_install_script: true
    secrets: inherit

  release:
    needs: [build-msi]
    runs-on: ubuntu-latest-32-cores
    steps:
      - name: Redirect temp directories
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "GOTMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # For goreleaser
          fetch-depth: 0
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.BDOT_GCS_RELEASE_BUCKET_PROJECT_ID }}
          credentials_json: ${{ secrets.BDOT_GCS_RELEASE_BUCKET_CREDENTIALS }}
      - name: Install Gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false # Caching handled by the actions/cache step below
      - name: Set up Go cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install ocb
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 10
          command: make install-tools
      - name: Retrieve Windows AMD64 MSI Installer
        uses: actions/download-artifact@v4
        with:
          name: bindplane-otel-collector.msi
      - name: Retrieve Windows ARM64 MSI Installer
        uses: actions/download-artifact@v4
        with:
          name: bindplane-otel-collector-arm64.msi
      - name: Install cosign
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 10
          command: go install github.com/sigstore/cosign/cmd/cosign@v1.13.1
      - name: Build cosign key file
        run: 'echo "$COSIGN_PRIVATE_KEY" >> cosign.key'
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{secrets.ORG_COSIGN_PRIVATE_KEY}}
      - name: Cache Goreleaser Build
        uses: actions/cache@v6
        with:
          path: ~/.cache/goreleaser
          key: ${{ runner.os }}-goreleaser-${{ hashFiles('.goreleaser.yml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-goreleaser-
      - name: Sign AMD64 MSI
        run: cosign sign-blob --key=cosign.key --output-signature ./bindplane-otel-collector.msi.sig ./bindplane-otel-collector.msi
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.ORG_COSIGN_PWD }}
      - name: Sign ARM64 MSI
        run: cosign sign-blob --key=cosign.key --output-signature ./bindplane-otel-collector-arm64.msi.sig ./bindplane-otel-collector-arm64.msi
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.ORG_COSIGN_PWD }}
      # Staged into place by goreleaser's overlay before-hook, not here:
      # goreleaser validates git state before running its hooks, so touching
      # the tracked script from a workflow step fails the release with
      # "git is in a dirty state". The download directory is gitignored.
      - name: Retrieve Signed Windows Install Script
        uses: actions/download-artifact@v4
        with:
          name: signed-install-script
          path: signed-install-script
      # The Windows binaries goreleaser packages must be the signed ones from
      # the build-msi job, not the unsigned copies its before-hook builds here.
      - name: Retrieve Signed Windows Binaries
        uses: actions/download-artifact@v4
        with:
          pattern: signed-windows-*
          merge-multiple: true
          path: signed-windows
      - name: Write signing key for nFPM
        shell: bash
        run: |
          cat > ci-signing-key.asc <<'EOF'
          ${{ secrets.GPG_PRIVATE_SIGNING_KEY }}
          EOF

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: "v2.12.5"
          args: release --clean --timeout 120m
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.ORG_GORELEASER_GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          SIGNED_WINDOWS_DIR: signed-windows
          SIGNED_INSTALL_SCRIPT: signed-install-script/install_windows.ps1
          COSIGN_PWD: ${{ secrets.ORG_COSIGN_PWD }}
          SIGNING_KEY_FILE: ci-signing-key.asc
      - name: Sign Windows 64-bit ZIP Archive
        run: cosign sign-blob --key=cosign.key --output-signature ./dist/bindplane-otel-collector-${{ github.ref_name }}-windows-amd64.zip.sig ./dist/bindplane-otel-collector-${{ github.ref_name }}-windows-amd64.zip
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.ORG_COSIGN_PWD }}
      # Create artifact bundle and upload to release
      - name: Create artifact archive
        run: |
          mkdir artifacts
          cp ./scripts/install/*.sh ./artifacts
          cp ./scripts/install/*.ps1 ./artifacts
          cp ./release_deps/gpg-keys.tar.gz ./artifacts/gpg-keys.tar.gz
          cp ./bindplane-otel-collector.msi ./artifacts
          cp ./bindplane-otel-collector-arm64.msi ./artifacts
          cp ./dist/*tar.gz ./artifacts
          cp ./dist/*.zip ./artifacts
          cp ./dist/*.rpm ./artifacts
          cp ./dist/*.deb ./artifacts
          cp ./dist/*SHA256SUMS ./artifacts
          tar -czvf bindplane-otel-collector-${{ github.ref_name }}-artifacts.tar.gz -C ./artifacts .
      - name: Sign artifact archive
        run: cosign sign-blob --key=cosign.key --output-signature ./bindplane-otel-collector-${{ github.ref_name }}-artifacts.tar.gz.sig ./bindplane-otel-collector-${{ github.ref_name }}-artifacts.tar.gz
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.ORG_COSIGN_PWD }}
      - name: Upload Latest Install Scripts
        run: |
          gsutil cp ./scripts/install/install_unix.sh gs://bdot-release/latest/install_unix.sh
          gsutil cp ./scripts/install/install_macos.sh gs://bdot-release/latest/install_macos.sh
          gsutil cp ./scripts/install/install_windows.ps1 gs://bdot-release/latest/install_windows.ps1
          gsutil cp ./release_deps/gpg-keys.tar.gz gs://bdot-release/latest/gpg-keys.tar.gz
      - name: Upload artifact bundle to release
        uses: AButler/upload-release-assets@v2.0
        with:
          repo-token: ${{ secrets.ORG_GORELEASER_GITHUB_TOKEN }}
          files: "bindplane-otel-collector-${{ github.ref_name }}-artifacts.tar.gz*"
          release-tag: ${{ github.ref_name }}
      # Trigger installation tests in otel-collector-installer-testing
      - name: Trigger Installation Testing
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.ORG_GORELEASER_GITHUB_TOKEN }}
          repository: observIQ/otel-collector-installer-testing
          event-type: upstream_prerelease
          client-payload: '{ "version": "${{ github.ref_name }}" }'

      # Linux package uploads to Google Artifact Registry

      # google-github-actions/auth@v2 was used above to install
      # gcloud sdk. google-github-actions/auth was used as well
      # but we need to re-authenticate to upload packages to the
      # correct project.
      - name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.ORG_BINDPLANE_PUBLIC_LINUX_REPO_JSON_KEY }}"

      - name: Upload Bindplane Linux AMD64 Deb Package
        run: |
          gcloud \
            --project bindplane-repository \
            artifacts apt upload stable-deb \
            --location us-central1 \
            --source dist/bindplane-otel-collector_${{ github.ref_name }}_linux_amd64.deb

      - name: Upload Bindplane Linux AMD64 RPM Package
        run: |
          gcloud \
            --project bindplane-repository \
            artifacts yum upload stable-rpm \
            --location us-central1 \
            --source dist/bindplane-otel-collector_${{ github.ref_name }}_linux_amd64.rpm

      - name: Upload Bindplane Linux ARM64 Deb Package
        run: |
          gcloud \
            --project bindplane-repository \
            artifacts apt upload stable-deb \
            --location us-central1 \
            --source dist/bindplane-otel-collector_${{ github.ref_name }}_linux_arm64.deb

      - name: Upload Bindplane Linux ARM64 RPM Package
        run: |
          gcloud \
            --project bindplane-repository \
            artifacts yum upload stable-rpm \
            --location us-central1 \
            --source dist/bindplane-otel-collector_${{ github.ref_name }}_linux_arm64.rpm

      - name: Upload Bindplane Linux PPC64LE Deb Package
        run: |
          gcloud \
            --project bindplane-repository \
            artifacts apt upload stable-deb \
            --location us-central1 \
            --source dist/bindplane-otel-collector_${{ github.ref_name }}_linux_ppc64le.deb

      - name: Upload Bindplane Linux PPC64LE RPM Package
        run: |
          gcloud \
            --project bindplane-repository \
            artifacts yum upload stable-rpm \
            --location us-central1 \
            --source dist/bindplane-otel-collector_${{ github.ref_name }}_linux_ppc64le.rpm

      - name: Upload Bindplane Linux PPC64 Deb Package
        run: |
          gcloud \
            --project bindplane-repository \
            artifacts apt upload stable-deb \
            --location us-central1 \
            --source dist/bindplane-otel-collector_${{ github.ref_name }}_linux_ppc64.deb

      - name: Upload Bindplane Linux PPC64 RPM Package
        run: |
          gcloud \
            --project bindplane-repository \
            artifacts yum upload stable-rpm \
            --location us-central1 \
            --source dist/bindplane-otel-collector_${{ github.ref_name }}_linux_ppc64.rpm

  # AIX release job — runs in parallel with the main release job.
  # Artifacts are uploaded to GCS and appended to the main GitHub release.
  release-aix:
    runs-on: ubuntu-latest-32-cores
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.BDOT_GCS_RELEASE_BUCKET_PROJECT_ID }}
          credentials_json: ${{ secrets.BDOT_GCS_RELEASE_BUCKET_CREDENTIALS }}
      - name: Install Gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false
      - name: Set up Go cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install Tools
        run: make install-tools
      - name: Build cosign key file
        run: 'echo "$COSIGN_PRIVATE_KEY" >> cosign.key'
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{secrets.ORG_COSIGN_PRIVATE_KEY}}
      - name: Import GPG signing key
        run: |
          echo "$GPG_PRIVATE_SIGNING_KEY" | gpg --batch --import
          echo "GPG_FINGERPRINT=$(gpg --list-keys --with-colons | grep fpr | head -1 | cut -d: -f10)" >> $GITHUB_ENV
        env:
          GPG_PRIVATE_SIGNING_KEY: ${{ secrets.GPG_PRIVATE_SIGNING_KEY }}
      - name: Run GoReleaser (AIX)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: "v2.12.5"
          args: release --config .goreleaser-aix.yml --timeout 120m
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.ORG_GORELEASER_GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          COSIGN_PWD: ${{ secrets.ORG_COSIGN_PWD }}
          GPG_FINGERPRINT: ${{ env.GPG_FINGERPRINT }}
      - name: Upload AIX artifacts to GitHub release
        run: gh release upload ${{ github.ref_name }} ./dist/*tar.gz ./dist/*SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ secrets.ORG_GORELEASER_GITHUB_TOKEN }}

  # Gate the prerelease on the executables actually being signed, not just the
  # MSI. Releases publish as a prerelease first, so a failure here blocks
  # promotion instead of arriving after customers have the artifacts.
  verify-windows-release:
    needs: [release]
    runs-on: windows-2022
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v7
      - name: Download Windows Release Artifacts
        run: |
          mkdir artifacts
          gh release download "$env:TAG" `
            --repo "$env:GITHUB_REPOSITORY" `
            --dir artifacts `
            --pattern "*-windows-*.zip" `
            --pattern "*.msi" `
            --pattern "install_windows.ps1"
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.ORG_GORELEASER_GITHUB_TOKEN }}
      - name: Verify Windows Signatures
        run: ./scripts/ci/verify-windows-signatures.ps1 -Root ./artifacts
        shell: pwsh
