name: release-containers
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Collector Version (vX.Y.Z or vX.Y.Z-prerelease.N)"
        required: true
        default: "v0.0.1"
  # Uncomment the following to automatically trigger this workflow after
  # the release workflow completes successfully on a version tag push.
  # When enabled, remove the manual version input above and replace
  # references to ${{ github.event.inputs.version }} with ${{ github.ref_name }},
  # since the triggering tag will be available directly on the context.
  #
  # workflow_run:
  #   workflows: ["release"]
  #   types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-containers-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  release-containers:
    runs-on: ubuntu-latest-32-cores
    # Uncomment the following when switching to workflow_run trigger,
    # to ensure the job only runs if the release workflow succeeded.
    # if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Redirect temp directories
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "GOTMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Normalize and validate version input
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.version }}"
          # Strip a leading "v" if present, then validate.
          VERSION_NO_V="${INPUT#v}"
          if [[ ! "$VERSION_NO_V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid version '$INPUT'. Expected vX.Y.Z or vX.Y.Z-prerelease.N"
            exit 1
          fi
          echo "VERSION_NO_V=${VERSION_NO_V}" >> "$GITHUB_ENV"
          echo "VERSION=v${VERSION_NO_V}" >> "$GITHUB_ENV"
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.BDOT_GCS_RELEASE_BUCKET_PROJECT_ID }}
          credentials_json: ${{ secrets.BDOT_GCS_RELEASE_BUCKET_CREDENTIALS }}
      - name: Install Gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false
      - name: Set up Go cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Download Linux Binaries from GCS
        run: |
          set -euo pipefail
          mkdir -p tmp release_deps/supervisor_bin
          for ARCH in amd64 arm64; do
            ARCHIVE="bindplane-otel-collector-v${VERSION_NO_V}-linux-${ARCH}.tar.gz"
            gsutil cp "gs://bdot-release/v${VERSION_NO_V}/${ARCHIVE}" "tmp/${ARCHIVE}"
            mkdir -p "tmp/extracted_${ARCH}"
            tar -xzf "tmp/${ARCHIVE}" -C "tmp/extracted_${ARCH}"
            mv "tmp/extracted_${ARCH}/bindplane-otel-collector" "tmp/collector_linux_${ARCH}"
            mv "tmp/extracted_${ARCH}/opampsupervisor" "release_deps/supervisor_bin/opampsupervisor_linux_${ARCH}"
          done
      - name: Prepare release_deps
        run: |
          set -euo pipefail
          echo "v${VERSION_NO_V}" > release_deps/VERSION.txt
          cp -r plugins release_deps/
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Login to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ORG_GORELEASER_GITHUB_TOKEN }}
      - name: Cache Goreleaser Build
        uses: actions/cache@v6
        with:
          path: ~/.cache/goreleaser
          key: ${{ runner.os }}-goreleaser-${{ hashFiles('.goreleaser-docker.yml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-goreleaser-
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: "v2.12.5"
          args: release --clean --timeout 120m --config .goreleaser-docker.yml
        env:
          GORELEASER_CURRENT_TAG: ${{ env.VERSION }}
          GITHUB_TOKEN: ${{ secrets.ORG_GORELEASER_GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          COSIGN_PWD: ${{ secrets.ORG_COSIGN_PWD }}
