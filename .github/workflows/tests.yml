name: Tests
on:
  pull_request:

jobs:
  # Graphite CI optimization: skip redundant CI runs for stacked PRs.
  # See https://graphite.com/docs/stacking-and-ci
  optimize_ci:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      skip: ${{ steps.check_skip.outputs.skip }}
    steps:
      - name: Optimize CI
        id: check_skip
        uses: withgraphite/graphite-ci-action@26bc0dcdeaba101794931d67a464ecbb21a76a8b # v0.0.9 tag (no formal releases)
        with:
          graphite_token: ${{ secrets.GRAPHITE_CI_OPTIMIZER_TOKEN }}

  # Detect which files changed to skip irrelevant jobs on PRs.
  detect-changes:
    if: ${{ needs.optimize_ci.outputs.skip != 'true' }}
    needs: optimize_ci
    runs-on: ubuntu-latest-8-cores
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # if this file changed, run all tests. if the makefile changed, run all tests.
      go: ${{ steps.filter.outputs.go == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.makefile == 'true' }}
      updater: ${{ steps.filter.outputs.updater == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.makefile == 'true' }}
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v7
      - name: Detect changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # These filters are based on picomatch syntax https://github.com/micromatch/picomatch#
          filters: |
            tests:
              - '.github/workflows/tests.yml'
            makefile:
              - 'Makefile'
            go:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
            updater:
              - 'updater/**'

  unit-tests:
    if: ${{ needs.optimize_ci.outputs.skip != 'true' && github.actor != 'dependabot[bot]' && needs.detect-changes.outputs.go == 'true' }}
    needs:
      - optimize_ci
      - detect-changes
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          # Ubuntu - All tests
          - os: ubuntu
            runner: ubuntu-latest-32-cores
            # GitHub-hosted runners execute as the unprivileged `runner` user, so
            # `sudo` sanitizes PATH (secure_path) and drops /home/runner/go/bin where
            # gotestsum lives. Preserve PATH so the tools installed above resolve.
            test_cmd: sudo env "PATH=$PATH" make test-updater-integration
          # macOS - All tests
          - os: macos
            runner: macos-15-xlarge
            test_cmd: make test-updater-integration
          # Windows - All tests
          - os: windows
            runner: windows-2022-16-cores
            test_cmd: make test-updater-integration
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Sources (non-Windows)
        if: matrix.os != 'windows'
        uses: actions/checkout@v7

      - name: Checkout Sources (Windows)
        if: matrix.os == 'windows'
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: internal/extension/opampconnectionextension/go.mod
          cache: false

      - name: Cache Go modules (Ubuntu)
        if: matrix.os == 'ubuntu'
        uses: actions/cache@v6
        with:
          path: /home/runner/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Cache Go build cache (Ubuntu)
        if: matrix.os == 'ubuntu'
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Cache Go modules (macOS)
        if: matrix.os == 'macos'
        uses: actions/cache@v6
        with:
          path: /Users/runner/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Cache Go build cache (macOS)
        if: matrix.os == 'macos'
        uses: actions/cache@v6
        with:
          path: /Users/runner/Library/Caches/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Cache Go modules (Windows)
        if: matrix.os == 'windows'
        uses: actions/cache@v6
        with:
          path: C:\Users\runneradmin\go\pkg\mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Cache Go build cache (Windows)
        if: matrix.os == 'windows'
        uses: actions/cache@v6
        with:
          path: C:\Users\runneradmin\AppData\Local\go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Cache Tools (Ubuntu)
        if: matrix.os == 'ubuntu'
        uses: actions/cache@v6
        with:
          path: /home/runner/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('**/go.sum', '**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Cache Tools (macOS)
        if: matrix.os == 'macos'
        uses: actions/cache@v6
        with:
          path: /Users/runner/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('**/go.sum', '**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Cache Tools (Windows)
        if: matrix.os == 'windows'
        uses: actions/cache@v6
        with:
          path: C:\Users\runneradmin\go\bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('**/go.sum', '**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Install Tools
        run: make install-tools-ci

      - name: Run All Tests
        run: make test

      # Run updater integration tests for Ubuntu and macOS (always)
      # For Windows, only run when updater code changed
      - name: Run Updater Integration Tests
        if: ${{ needs.detect-changes.outputs.updater == 'true' }}
        run: ${{ matrix.test_cmd }}

  test-summary:
    if: always()
    needs: [optimize_ci, unit-tests]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Check test results
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.unit-tests.result }}
        run: |
          if [[ "$RESULT" == "success" ]]; then
            echo "All tests passed"
          elif [[ "$RESULT" == "skipped" ]]; then
            echo "Tests skipped"
          elif [[ "$RESULT" == "cancelled" ]]; then
            # A cancelled result is a false failure when the run was superseded by a
            # newer run (concurrency cancel-in-progress). Pass in that case; fail only
            # on a manual cancel with no replacement. Mirrors the enterprise ci-status
            # gate (observIQ/bindplane-op-enterprise#7813) so this stays correct if this
            # repo ever adopts cancel-in-progress, with no adjustment required.
            ENCODED_BRANCH=$(printf '%s' "$BRANCH" | jq -sRr @uri)
            NEWER_COUNT=$(gh api \
              "repos/${REPO}/actions/workflows/tests.yml/runs?branch=${ENCODED_BRANCH}&per_page=5" \
              --jq "[.workflow_runs[] | select(.id > ${CURRENT_RUN_ID})] | length" 2>&1)
            if ! [[ "$NEWER_COUNT" =~ ^[0-9]+$ ]]; then
              echo "Failed to query GitHub API: $NEWER_COUNT"
              exit 1
            fi
            if [[ "$NEWER_COUNT" -gt 0 ]]; then
              echo "Run was superseded by a newer run (concurrency cancellation), passing"
            else
              echo "Run was manually cancelled with no replacement, failing"
              exit 1
            fi
          else
            echo "Tests failed"
            exit 1
          fi
