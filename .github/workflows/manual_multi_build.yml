# Build is responsible for testing builds on all supported platforms.
# It is broken up into three separate jobs with targeted builds so that each OS will
# build in parallel and speed up overall CI time.
name: Build
on:
  workflow_dispatch:

jobs:
  setup-tools:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest-4-cores
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          check-latest: true
      - name: Cache Tools
        id: tool-cache
        uses: actions/cache@v6
        with:
          path: /home/runner/go/bin
          key: tooling-${{ runner.os }}-${{ hashFiles('./internal/tools/go.sum') }}
      - name: Install Tools
        if: steps.tool-cache.outputs.cache-hit != 'true'
        run: make install-tools

  build_linux:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest-4-cores
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache-dependency-path: |
            **/go.sum
      - name: Install ocb
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 10
          command: make install-tools
      - name: Build
        run: make build-linux
      - name: Scan Third Party Dependency Licenses
        run: lichen --config=./license.yaml $(find dist/collector_* release_deps/supervisor_bin/opampsupervisor_*)
  build_darwin:
    if: github.actor != 'dependabot[bot]'
    runs-on: macos-14
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache-dependency-path: |
            **/go.sum
      - name: Install ocb
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 10
          command: make install-tools
      - name: Build
        run: make build-darwin
      - name: Scan Third Party Dependency Licenses
        run: lichen --config=./license.yaml $(find dist/collector_* release_deps/supervisor_bin/opampsupervisor_*)
  build_windows:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest-4-cores
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          check-latest: true
          cache-dependency-path: |
            **/go.sum
      - name: Install ocb
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 10
          command: make install-tools
      - name: Build
        run: make build-windows
      - name: Scan Third Party Dependency Licenses
        run: lichen --config=./license.yaml dist/collector_windows_amd64.exe release_deps/supervisor_bin/opampsupervisor_windows_amd64.exe dist/collector_windows_arm64.exe release_deps/supervisor_bin/opampsupervisor_windows_arm64.exe
