# Build is responsible for testing builds on all supported platforms.
# It is broken up into three separate jobs with targeted builds so that each OS will
# build in parallel and speed up overall CI time.
name: Build
on:
  workflow_dispatch:

jobs:
  build_linux:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest-4-cores
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: internal/extension/opampconnectionextension/go.mod
          cache-dependency-path: |
            go.sum
            **/go.sum
      - name: Install ocb
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 10
          command: make install-ocb
      - name: Build
        run: make build-linux
      - name: Install lichen
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 10
          command: go install github.com/uw-labs/lichen@v0.1.7
      - name: Scan Third Party Dependency Licenses
        run: lichen --config=./license.yaml $(find dist/collector_* dist/updater_*)
  build_darwin:
    if: github.actor != 'dependabot[bot]'
    runs-on: macos-14
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: internal/extension/opampconnectionextension/go.mod
          cache-dependency-path: |
            go.sum
            **/go.sum
      - name: Install ocb
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 10
          command: make install-ocb
      - name: Build
        run: make build-darwin
      - name: Install lichen
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 10
          command: go install github.com/uw-labs/lichen@v0.1.7
      - name: Scan Third Party Dependency Licenses
        run: lichen --config=./license.yaml $(find dist/collector_* dist/updater_*)
  build_windows:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest-4-cores
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: internal/extension/opampconnectionextension/go.mod
          cache-dependency-path: |
            go.sum
            **/go.sum
      - name: Install ocb
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 10
          command: make install-ocb
      - name: Build
        run: make build-windows
      - name: Install lichen
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 10
          command: go install github.com/uw-labs/lichen@v0.1.7
      - name: Scan Third Party Dependency Licenses
        run: lichen --config=./license.yaml dist/collector_windows_amd64.exe dist/updater_windows_amd64.exe dist/collector_windows_arm64.exe dist/updater_windows_arm64.exe
