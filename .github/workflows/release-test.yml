name: Release Test
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Collector Version"
        required: true
        default: "v0.0.1"

jobs:
  build-msi:
    uses: ./.github/workflows/build-signed-windows.yml
    with:
      version: ${{ inputs.version }}
      sign_install_script: true
    secrets: inherit

  release-test:
    runs-on: ubuntu-latest-32-cores
    needs: [build-msi, release-test-aix]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false # Caching handled by the actions/cache step below
      - name: Set up Go cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install ocb
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 10
          command: make install-tools

      - name: Set VERSION
        run: echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV

      - name: Retrieve Windows AMD64 MSI Installer
        uses: actions/download-artifact@v8
        with:
          name: bindplane-otel-collector.msi

      - name: Retrieve Windows ARM64 MSI Installer
        uses: actions/download-artifact@v8
        with:
          name: bindplane-otel-collector-arm64.msi
      - name: Retrieve AIX Packages
        uses: actions/download-artifact@v8
        with:
          name: aix-dist
          path: aix-dist

      - name: Install cosign
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 10
          command: go install github.com/sigstore/cosign/cmd/cosign@v1.13.1
      - name: Build cosign key file
        run: 'echo "$COSIGN_PRIVATE_KEY" >> cosign.key'
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{secrets.ORG_COSIGN_PRIVATE_KEY}}

      - name: Sign AMD64 MSI
        run: cosign sign-blob --key=cosign.key --output-signature ./bindplane-otel-collector.msi.sig ./bindplane-otel-collector.msi
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.ORG_COSIGN_PWD }}

      - name: Sign ARM64 MSI
        run: cosign sign-blob --key=cosign.key --output-signature ./bindplane-otel-collector-arm64.msi.sig ./bindplane-otel-collector-arm64.msi
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.ORG_COSIGN_PWD }}

      - name: Cache Goreleaser Build
        uses: actions/cache@v6
        with:
          path: ~/.cache/goreleaser
          key: ${{ runner.os }}-goreleaser-${{ hashFiles('.goreleaser.yml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-goreleaser-

      # Staged into place by goreleaser's overlay before-hook, not here:
      # goreleaser validates git state before running its hooks, so touching
      # the tracked script from a workflow step fails the release with
      # "git is in a dirty state". The download directory is gitignored.
      - name: Retrieve Signed Windows Install Script
        uses: actions/download-artifact@v8
        with:
          name: signed-install-script
          path: signed-install-script
      # The Windows binaries goreleaser packages must be the signed ones from
      # the build-msi job, not the unsigned copies its before-hook builds here.
      - name: Retrieve Signed Windows Binaries
        uses: actions/download-artifact@v8
        with:
          pattern: signed-windows-*
          merge-multiple: true
          path: signed-windows
      - name: Write signing key for nFPM
        shell: bash
        run: |
          cat > ci-signing-key.asc <<'EOF'
          ${{ secrets.GPG_PRIVATE_SIGNING_KEY }}
          EOF

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: "v2.12.5"
          args: release --skip=publish --skip=validate --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ env.VERSION }}
          GITHUB_TOKEN: ${{ secrets.ORG_GORELEASER_GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          SIGNED_WINDOWS_DIR: signed-windows
          SIGNED_INSTALL_SCRIPT: signed-install-script/install_windows.ps1
          SIGNING_KEY_FILE: ci-signing-key.asc
          COSIGN_PWD: ${{ secrets.ORG_COSIGN_PWD }}

      - name: Debug list dist/
        run: |
          ls -laR dist/

      - name: Sign Windows AMD64 64-bit ZIP Archive
        run: cosign sign-blob --key=cosign.key --output-signature ./dist/bindplane-otel-collector-${{ github.event.inputs.version }}-windows-amd64.zip.sig ./dist/bindplane-otel-collector-${{ github.event.inputs.version }}-windows-amd64.zip
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.ORG_COSIGN_PWD }}

      - name: Sign Windows ARM64 64-bit ZIP Archive
        run: cosign sign-blob --key=cosign.key --output-signature ./dist/bindplane-otel-collector-${{ github.event.inputs.version }}-windows-arm64.zip.sig ./dist/bindplane-otel-collector-${{ github.event.inputs.version }}-windows-arm64.zip
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.ORG_COSIGN_PWD }}

      - name: Create artifact archive
        run: |
          mkdir artifacts
          cp ./scripts/install/*.sh ./artifacts
          cp ./scripts/install/*.ps1 ./artifacts
          cp ./release_deps/gpg-keys.tar.gz ./artifacts/gpg-keys.tar.gz
          cp ./bindplane-otel-collector.msi ./artifacts
          cp ./bindplane-otel-collector-arm64.msi ./artifacts
          cp ./dist/*tar.gz ./artifacts
          cp ./aix-dist/* ./artifacts
          cp ./dist/*.zip ./artifacts
          cp ./dist/*.rpm ./artifacts
          cp ./dist/*.deb ./artifacts
          cp ./dist/*SHA256SUMS ./artifacts
          tar -czvf bindplane-otel-collector-${{ github.event.inputs.version }}-artifacts.tar.gz -C ./artifacts .

      - name: Sign artifact archive
        run: cosign sign-blob --key=cosign.key --output-signature ./bindplane-otel-collector-${{ github.event.inputs.version }}-artifacts.tar.gz.sig ./bindplane-otel-collector-${{ github.event.inputs.version }}-artifacts.tar.gz
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.ORG_COSIGN_PWD }}

      - name: Check Artifacts Directory
        run: |
          ls -la artifacts
          du -sh artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bindplane-otel-collector-${{ github.event.inputs.version }}-artifacts.tar.gz
          path: bindplane-otel-collector-${{ github.event.inputs.version }}-artifacts.tar.gz
          retention-days: 1

      # Linux package uploads to Google Artifact Registry

      # google-github-actions/auth@v2 was used above to install
      # gcloud sdk. google-github-actions/auth was used as well
      # but we need to re-authenticate to upload packages to the
      # correct project.
      - name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.ORG_BINDPLANE_PUBLIC_LINUX_REPO_JSON_KEY }}"

      - name: Upload Bindplane Linux AMD64 Deb Package
        run: |
          gcloud \
            --project bindplane-repository \
            artifacts apt upload devel-deb \
            --location us-central1 \
            --source dist/bindplane-otel-collector_${{ env.VERSION }}_linux_amd64.deb

      - name: Upload Bindplane Linux AMD64 RPM Package
        run: |
          gcloud \
            --project bindplane-repository \
            artifacts yum upload devel-rpm \
            --location us-central1 \
            --source dist/bindplane-otel-collector_${{ env.VERSION }}_linux_amd64.rpm

      - name: Upload Bindplane Linux ARM64 Deb Package
        run: |
          gcloud \
            --project bindplane-repository \
            artifacts apt upload devel-deb \
            --location us-central1 \
            --source dist/bindplane-otel-collector_${{ env.VERSION }}_linux_arm64.deb

      - name: Upload Bindplane Linux ARM64 RPM Package
        run: |
          gcloud \
            --project bindplane-repository \
            artifacts yum upload devel-rpm \
            --location us-central1 \
            --source dist/bindplane-otel-collector_${{ env.VERSION }}_linux_arm64.rpm

      - name: Upload Bindplane Linux PPC64LE Deb Package
        run: |
          gcloud \
            --project bindplane-repository \
            artifacts apt upload devel-deb \
            --location us-central1 \
            --source dist/bindplane-otel-collector_${{ env.VERSION }}_linux_ppc64le.deb

      - name: Upload Bindplane Linux PPC64LE RPM Package
        run: |
          gcloud \
            --project bindplane-repository \
            artifacts yum upload devel-rpm \
            --location us-central1 \
            --source dist/bindplane-otel-collector_${{ env.VERSION }}_linux_ppc64le.rpm

      - name: Upload Bindplane Linux PPC64 Deb Package
        run: |
          gcloud \
            --project bindplane-repository \
            artifacts apt upload devel-deb \
            --location us-central1 \
            --source dist/bindplane-otel-collector_${{ env.VERSION }}_linux_ppc64.deb

      - name: Upload Bindplane Linux PPC64 RPM Package
        run: |
          gcloud \
            --project bindplane-repository \
            artifacts yum upload devel-rpm \
            --location us-central1 \
            --source dist/bindplane-otel-collector_${{ env.VERSION }}_linux_ppc64.rpm

  # AIX builds first. The release-test job lists the packages in the main
  # SHA256SUMS and the artifact bundle.
  release-test-aix:
    runs-on: ubuntu-latest-32-cores
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false
      - name: Set up Go cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Set VERSION
        run: echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
      - name: Install Tools
        run: make install-tools
      # Sign with the release keys like build-aix, so the package verifies end to end.
      - name: Build cosign key file
        run: 'echo "$COSIGN_PRIVATE_KEY" >> cosign.key'
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{secrets.ORG_COSIGN_PRIVATE_KEY}}
      - name: Import GPG signing key
        run: |
          echo "$GPG_PRIVATE_SIGNING_KEY" | gpg --batch --import
          echo "GPG_FINGERPRINT=$(gpg --list-keys --with-colons | grep fpr | head -1 | cut -d: -f10)" >> $GITHUB_ENV
        env:
          GPG_PRIVATE_SIGNING_KEY: ${{ secrets.GPG_PRIVATE_SIGNING_KEY }}
      - name: Run GoReleaser (AIX)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: "v2.12.5"
          args: release --config .goreleaser-aix.yml --skip=publish --skip=validate
        env:
          GORELEASER_CURRENT_TAG: ${{ env.VERSION }}
          GITHUB_TOKEN: ${{ secrets.ORG_GORELEASER_GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          COSIGN_PWD: ${{ secrets.ORG_COSIGN_PWD }}
          GPG_FINGERPRINT: ${{ env.GPG_FINGERPRINT }}
      - name: Debug list dist/
        run: |
          tree dist/ 2>/dev/null || echo "No dist directory"
          du -sh dist/ 2>/dev/null || true
      - name: Upload AIX Packages
        uses: actions/upload-artifact@v7
        with:
          name: aix-dist
          path: dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 1

  # The rehearsal runs goreleaser with --skip=publish, so there is no GitHub
  # release to read. Verify the artifact bundle the release-test job uploads.
  verify-windows-release:
    needs: [release-test]
    runs-on: windows-2022
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v7
      - name: Download Artifact Bundle
        uses: actions/download-artifact@v8
        with:
          name: bindplane-otel-collector-${{ inputs.version }}-artifacts.tar.gz
          path: bundle
      - name: Unpack Artifact Bundle
        run: |
          mkdir artifacts
          tar -xzvf "bundle/bindplane-otel-collector-$env:VERSION-artifacts.tar.gz" -C artifacts
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
      - name: Verify Windows Signatures
        run: ./scripts/ci/verify-windows-signatures.ps1 -Root ./artifacts
        shell: pwsh
