# The AIX build: the v2 AIX component set at this repo's manifest.yaml versions,
# without the deprecated bindplaneextension and with opampconnectionextension.
# Every component must also be in manifest.yaml at the same version (make check-aix-manifest).
dist:
  name: bdot-collector
  description: Bindplane Distro for OpenTelemetry Collector
  module: github.com/observiq/bindplane-otel-collector/build
  version: 0.0.0
  output_path: ./build

conf_resolver:
  default_uri_scheme: "env"

extensions:
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/ackextension v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/basicauthextension v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/bearertokenauthextension v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/encoding/jsonlogencodingextension v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/encoding/textencodingextension v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/headerssetterextension v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/oauth2clientauthextension v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/oidcauthextension v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/opampextension v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/pprofextension v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/sigv4authextension v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.163.0
  # Bindplane OpAMP connection extension. Internal module under
  # internal/extension/opampconnectionextension/, kept internal because the
  # whole runtime cluster (collector lifecycle, OpAMP client, packagestate,
  # report manager, etc.) ships in the same module. Local replace below.
  - gomod: github.com/observiq/bindplane-otel-collector/internal/extension/opampconnectionextension v1.111.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.163.0
  - gomod: go.opentelemetry.io/collector/exporter/nopexporter v0.163.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.163.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.163.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.163.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/attributesprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/cumulativetodeltaprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/deltatocumulativeprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/deltatorateprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/geoipprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/groupbyattrsprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/groupbytraceprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/intervalprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/logdedupprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/logstransformprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/metricsgenerationprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/metricstransformprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/probabilisticsamplerprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/redactionprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/spanprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/tailsamplingprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/unrollprocessor v0.163.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/datapointcountprocessor v1.2.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/logcountprocessor v1.2.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/lookupprocessor v1.2.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/maskprocessor v1.2.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/metricextractprocessor v1.2.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/metricstatsprocessor v1.2.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/randomfailureprocessor v1.2.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/removeemptyvaluesprocessor v1.2.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/resourceattributetransposerprocessor v1.2.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/samplingprocessor v1.2.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/spancountprocessor v1.2.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/throughputmeasurementprocessor v1.2.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/topologyprocessor v1.2.0
  # Bindplane snapshot processor — its own internal go.mod, local replace below.
  - gomod: github.com/observiq/bindplane-otel-collector/internal/processor/snapshotprocessor v1.111.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/nopreceiver v0.163.0
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/collectdreceiver v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filestatsreceiver v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.163.0
  # keep this version pinned at v0.156.0 for the correct version to be reported in available components
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/jmxreceiver v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/otlpjsonfilereceiver v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/saphanareceiver v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/statsdreceiver v0.163.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/receiver/pcapreceiver v1.2.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/receiver/pluginreceiver v1.2.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/receiver/routereceiver v1.2.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/receiver/telemetrygeneratorreceiver v1.2.0

connectors:
  - gomod: go.opentelemetry.io/collector/connector/forwardconnector v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/countconnector v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/failoverconnector v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/roundrobinconnector v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/routingconnector v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/servicegraphconnector v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/signaltometricsconnector v0.163.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/spanmetricsconnector v0.163.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.69.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.69.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/httpsprovider v1.69.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.69.0

replaces:
  # Internal Go modules — point ocb at the local checkouts.
  - github.com/observiq/bindplane-otel-collector/internal/extension/opampconnectionextension => ../internal/extension/opampconnectionextension
  - github.com/observiq/bindplane-otel-collector/internal/processor/snapshotprocessor => ../internal/processor/snapshotprocessor
  - github.com/observiq/bindplane-otel-collector/internal/report => ../internal/report
  # Pinning replaces preserved from the legacy top-level go.mod.
  # These are not local-dev replaces — they're version pins / fork redirects
  # that must persist in release builds too.
  - github.com/mattn/go-ieproxy => github.com/mattn/go-ieproxy v0.0.1
  - github.com/cilium/ebpf => github.com/cilium/ebpf v0.11.0
  # Replace statement to pull in changes from this PR: https://github.com/observIQ/opentelemetry-collector-contrib/pull/4729
  # Remove once the above PR is merged, released, and the relevant components are updated to that version.
  # The commit being replaced to is built on the OTel v0.163.0 tag.
  # https://github.com/observIQ/opentelemetry-collector-contrib/tree/bdot-1.111.0
  - github.com/open-telemetry/opentelemetry-collector-contrib/pkg/stanza => github.com/observiq/opentelemetry-collector-contrib/pkg/stanza v0.0.0-20261027141406-ac80a8c6388b
  # The JMX receiver was removed in OTel v0.157.0. Pinned to a fork that we must maintain until we can migrate users to a new solution.
  # The commit being replaced to is built on the OTel v0.163.0 tag. 
  # https://github.com/observIQ/opentelemetry-collector-contrib/tree/bdot-1.111.0
  - github.com/open-telemetry/opentelemetry-collector-contrib/receiver/jmxreceiver => github.com/observiq/opentelemetry-collector-contrib/receiver/jmxreceiver v0.0.0-20261027141406-ac80a8c6388b
  # AIX host metrics come from the Bindplane gopsutil fork, which is maintained permanently.
  - github.com/shirou/gopsutil/v4 => github.com/observIQ/gopsutil/v4 d1842df9a81a02f760157eb891e40ad7f2c03d64
