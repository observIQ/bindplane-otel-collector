  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/receiver/routereceiver v1.0.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/receiver/telemetrygeneratorreceiver v1.0.0
connectors:
  - gomod: go.opentelemetry.io/collector/connector/forwardconnector v0.161.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/countconnector v0.161.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/failoverconnector v0.161.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/roundrobinconnector v0.161.0
