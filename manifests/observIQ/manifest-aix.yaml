  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/maskprocessor v1.0.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/metricextractprocessor v1.0.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/metricstatsprocessor v1.0.0
