providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.67.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.67.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/httpsprovider v1.67.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.67.0
# When adding a replace, add a comment before it to document why it's needed and when it can be removed
replaces:
  # The JMX receiver was removed in OTel v0.157.0. Pinned to a fork that we must maintain until we can migrate users to a new solution.
  # The commit being replaced to is built on the OTel v0.161.0 tag.
  # https://github.com/observIQ/opentelemetry-collector-contrib/tree/bdot-1.109.0
  - github.com/open-telemetry/opentelemetry-collector-contrib/receiver/jmxreceiver => github.com/observiq/opentelemetry-collector-contrib/receiver/jmxreceiver v0.0.0-20260928163111-c0a1ce236296
  # AIX patches for gopsutil - can be removed when upstream merges AIX support
  - github.com/shirou/gopsutil/v4 => github.com/observIQ/gopsutil/v4 5a5a066189b0ee94921407a2ef0a857c0b75e220
