# This manifest is a combination of the upstream opentelemetry-collector-contrib manifest & components unique to observIQ's distribution.
# https://github.com/open-telemetry/opentelemetry-collector-releases/blob/main/distributions/otelcol-contrib/manifest.yaml
dist:
  module: github.com/observiq/bindplane-otel-collector
  name: bindplane-otel-collector
  description: ObservIQ's custom distro for OpenTelemetry Collector
  version: "v2.0.1-beta.6"
  output_path: ./builder
  # embed_library enables the telemetrygeneratorreceiver blitz embed integration (PIPE-1017)
  # timetzdata embeds the IANA tz database so time.LoadLocation resolves named
  # zones on any platform, incl. scratch/Windows/AIX with no system tzdata.
  build_tags: embed_library,timetzdata
conf_resolver:
  default_uri_scheme: "env"
extensions:
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.161.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/ackextension v0.161.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/basicauthextension v0.161.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/bearertokenauthextension v0.161.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/encoding/jsonlogencodingextension v0.161.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/encoding/textencodingextension v0.161.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/headerssetterextension v0.161.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.161.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/oauth2clientauthextension v0.161.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/oidcauthextension v0.161.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/opampextension v0.161.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/pprofextension v0.161.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/sigv4authextension v0.161.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.161.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/extension/bindplaneextension v1.0.0
exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.161.0
  - gomod: go.opentelemetry.io/collector/exporter/nopexporter v0.161.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.161.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.161.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.161.0
