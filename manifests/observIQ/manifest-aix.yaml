  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/removeemptyvaluesprocessor v1.0.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/resourceattributetransposerprocessor v1.0.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/samplingprocessor v1.0.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/snapshotprocessor v1.0.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/spancountprocessor v1.0.0
  - gomod: github.com/dynatrace/dynatrace-bindplane-otel-contrib/processor/throughputmeasurementprocessor v1.0.0
