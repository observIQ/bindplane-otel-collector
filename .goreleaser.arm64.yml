version: 2

project_name: dbdot-collector

before:
  hooks:
    - make release-prep CURR_VERSION={{ .Version }}
    # Pre-build the linux/arm64 binary via ocb-driven `make`.
    - GOOS=linux GOARCH=arm64 make build-binaries OUTDIR="tmp"

after:
  hooks:
    - cmd: rm -rf tmp

# `builder: prebuilt` — Make owns the build (`AGENT_LDFLAGS`,
# `-tags $(AGENT_BUILD_TAGS)`, i.e. `bindplane embed_library`).
builds:
  - id: collector
    builder: prebuilt
    binary: dbdot-collector
    goos:
      - linux
    goarch:
      - arm64
    prebuilt:
      path: tmp/collector_{{ .Os }}_{{ .Arch }}{{ .Ext }}

dockers:
  - id: scratch-arm64
    goos: linux
    goarch: arm64
    retry:
      attempts: 10
      delay: 30s
      max_delay: 1m
    ids:
      - collector
    # GHCR only, matching .goreleaser-docker.yml. Docker Hub and GAR
    # publishing should be added back under Dynatrace-owned orgs/registries.
    image_templates:
      - "ghcr.io/dynatrace/dbdot-arm64:{{ .Version }}"
    dockerfile: ./docker/Dockerfile.scratch
    use: buildx
    build_flag_templates:
      - "--label=created={{.Date}}"
      - "--label=title={{.ProjectName}}"
      - "--label=revision={{.FullCommit}}"
      - "--label=version={{.Version}}"
      - "--platform=linux/arm64"
    extra_files:
      - release_deps/plugins
      - release_deps/config.yaml
      - config/logging.stdout.yaml
      - LICENSE

changelog:
  disable: true
