version: 2

project_name: observiq-otel-collector

before:
  hooks:
    - make release-prep CURR_VERSION={{ .Version }}
    # Pre-build the linux/arm64 binary via ocb-driven `make`. Goreleaser runs
    # hooks without a shell, so GOOS/GOARCH go in `env`, not as a command prefix.
    - cmd: make build-binaries OUTDIR=tmp
      env:
        - GOOS=linux
        - GOARCH=arm64

after:
  hooks:
    - cmd: rm -rf tmp

# `builder: prebuilt` — Make owns the build (`AGENT_LDFLAGS`,
# `-tags $(AGENT_BUILD_TAGS)`, i.e. `bindplane embed_library`).
builds:
  - id: collector
    builder: prebuilt
    binary: observiq-otel-collector
    goos:
      - linux
    goarch:
      - arm64
    prebuilt:
      path: tmp/collector_{{ .Os }}_{{ .Arch }}{{ .Ext }}
  # Unlike the collector (built by ocb/make and imported prebuilt),
  # container-init is a plain Go module goreleaser can build itself.
  - id: container-init
    dir: cmd/container-init
    binary: container-init
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    goos:
      - linux
    goarch:
      - arm64

dockers:
  - id: ubuntu-arm64
    goos: linux
    goarch: arm64
    retry:
      attempts: 10
      delay: 30s
      max_delay: 1m
    ids:
      - collector
      - container-init
    image_templates:
      - "observiq/bindplane-agent-arm64:{{ .Version }}"
      - "observiq/bindplane-agent-arm64:latest"
    dockerfile: ./docker/Dockerfile.ubuntu
    use: buildx
    build_flag_templates:
      - "--label=created={{.Date}}"
      - "--label=title={{.ProjectName}}"
      - "--label=revision={{.FullCommit}}"
      - "--label=version={{.Version}}"
      - "--platform=linux/arm64"
    extra_files:
      - release_deps/VERSION.txt
      - release_deps/plugins
      - release_deps/config.yaml
      - config/logging.stdout.yaml
      - LICENSE
      - release_deps/opentelemetry-java-contrib-jmx-metrics.jar

changelog:
  disable: true